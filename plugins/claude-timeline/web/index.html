<!doctype html>
<html><head><meta charset="utf-8"><title>Claude session timeline</title>
<style>
:root{--bg:#0b0d10;--fg:#e6e6e6;--muted:#888;--grid:#1d2127;--line1:#7aa2f7;--line2:#f7768e;--accent:#9ece6a;--warn:#e0af68;--bad:#f7768e}
*{box-sizing:border-box}body{margin:0;font:14px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{padding:16px 28px;border-bottom:1px solid var(--grid);display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:5}
h1{margin:0;font-size:17px;font-weight:600}
.stat{color:var(--muted);font-size:13px}
.stat b{color:var(--fg);font-variant-numeric:tabular-nums;font-weight:600}
.stat .v{color:var(--accent)}
.stat .w{color:var(--warn)}
.stat .big{font-size:20px;color:var(--warn);font-weight:700}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
.disconnected .live-dot{background:var(--bad);animation:none}
main{padding:20px 28px}
.source{font-size:11px;color:var(--muted);padding:6px 12px;background:#13171c;border:1px solid var(--grid);border-radius:4px;display:inline-block;margin-bottom:14px}
.chart-wrap{background:#0f1216;border:1px solid var(--grid);border-radius:8px;padding:16px;margin-bottom:20px}
svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:18px;font-size:12px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.swatch{display:inline-block;width:12px;height:2px;vertical-align:middle;margin-right:6px}
.prompts{background:#0f1216;border:1px solid var(--grid);border-radius:8px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--grid)}
th{background:#13171c;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;user-select:none;position:sticky;top:0}
th:hover{color:var(--fg)}
td.num{font-variant-numeric:tabular-nums;text-align:right}
td.prompt{max-width:560px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr:hover{background:#13171c}
.bar{display:inline-block;height:8px;background:linear-gradient(90deg,#7aa2f7,#f7768e);border-radius:2px;vertical-align:middle;margin-right:6px}
.proj{color:#9ece6a;font-size:11px}
.tip{position:fixed;pointer-events:none;background:#1a1d22;border:1px solid var(--grid);padding:8px 10px;border-radius:6px;font-size:12px;color:#ddd;max-width:380px;display:none;z-index:10;box-shadow:0 4px 12px rgba(0,0,0,.4);white-space:pre-wrap}
.empty{padding:40px;text-align:center;color:var(--muted)}
</style></head>
<body>
<header id="header">
  <h1><span class="live-dot" id="dot"></span>Claude timeline</h1>
  <span class="stat">5h: <b class="big" id="s-pct">—</b></span>
  <span class="stat" id="s-7d-wrap" style="display:none">7d <b id="s-7d">—</b></span>
  <span class="stat">started <b id="s-start">—</b> · elapsed <b class="v" id="s-elapsed">—</b></span>
  <span class="stat">resets <b id="s-ends">—</b> (<b class="w" id="s-remaining">—</b> left)</span>
  <span class="stat">prompts: <b id="s-prompts">—</b></span>
  <span class="stat">tokens: <b id="s-tokens">—</b></span>
  <span class="stat" style="margin-left:auto;font-size:11px" id="s-updated">connecting…</span>
</header>
<main>
  <div class="source" id="source">loading…</div>
  <div class="chart-wrap">
    <div class="legend">
      <span><span class="swatch" style="background:var(--line1)"></span>cumulative usage % (left)</span>
      <span><span class="swatch" style="background:var(--line2)"></span>cumulative prompts (right)</span>
      <span><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);vertical-align:middle;margin-right:6px"></span>prompt marker (size = tokens spent)</span>
      <span><span class="swatch" style="background:var(--warn)"></span>now / projected 100%</span>
    </div>
    <svg id="chart" viewBox="0 0 1000 380"></svg>
  </div>
  <div class="prompts">
    <table id="prompt-table">
      <thead><tr>
        <th data-sort="ts">time</th>
        <th data-sort="text">prompt</th>
        <th data-sort="project">project</th>
        <th data-sort="calls" class="num">api calls</th>
        <th data-sort="tokens" class="num">tokens</th>
        <th data-sort="weighted" class="num">weighted</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</main>
<div id="tip" class="tip"></div>
<script>
const SVGNS = 'http://www.w3.org/2000/svg'
const tip = document.getElementById('tip')
const chart = document.getElementById('chart')
const tbody = document.getElementById('tbody')
const dot = document.getElementById('dot')
const header = document.getElementById('header')
let D = null
let sortKey = 'weighted', sortDesc = true

function el(name, attrs, parent) {
  const e = document.createElementNS(SVGNS, name)
  for (const k in attrs) e.setAttribute(k, attrs[k])
  if (parent) parent.appendChild(e)
  return e
}
function fmtDur(ms) { return `${Math.floor(ms/3600000)}h ${Math.floor((ms%3600000)/60000)}m` }
function fmtTime(ts) { return new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) }
function showTip(e, lines) {
  while (tip.firstChild) tip.removeChild(tip.firstChild)
  for (const l of lines) {
    const div = document.createElement('div')
    if (l.bold) div.style.fontWeight = '600'
    if (l.color) div.style.color = l.color
    div.textContent = l.text
    tip.appendChild(div)
  }
  tip.style.display = 'block'; positionTip(e)
}
function positionTip(e) {
  tip.style.left = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 12) + 'px'
  tip.style.top = (e.clientY + 12) + 'px'
}
function hideTip() { tip.style.display = 'none' }
window.addEventListener('mousemove', e => { if (tip.style.display === 'block') positionTip(e) })

function renderHeader() {
  document.getElementById('s-pct').textContent = D.currentPct != null ? D.currentPct + '%' : '—'
  if (D.sevenDayPct != null) {
    document.getElementById('s-7d-wrap').style.display = ''
    document.getElementById('s-7d').textContent = D.sevenDayPct + '%'
  }
  const elapsed = D.generatedAt - D.sessionStart
  const remaining = D.sessionEnd - D.generatedAt
  document.getElementById('s-start').textContent = new Date(D.sessionStart).toLocaleTimeString()
  document.getElementById('s-elapsed').textContent = fmtDur(elapsed)
  document.getElementById('s-ends').textContent = new Date(D.sessionEnd).toLocaleTimeString()
  document.getElementById('s-remaining').textContent = fmtDur(Math.max(0, remaining))
  document.getElementById('s-prompts').textContent = D.promptCount
  document.getElementById('s-tokens').textContent = (D.totalTokens/1e6).toFixed(2) + 'M'
  document.getElementById('s-updated').textContent = 'updated ' + new Date(D.generatedAt).toLocaleTimeString()
  document.getElementById('source').textContent = 'source: ' + D.dataSource
}

function renderChart() {
  while (chart.firstChild) chart.removeChild(chart.firstChild)
  const W = 1000, H = 380, PAD = { l: 70, r: 60, t: 20, b: 36 }
  const x0 = D.sessionStart, x1 = D.sessionEnd
  const xs = ts => PAD.l + (ts - x0) / (x1 - x0) * (W - PAD.l - PAD.r)
  const promptByTs = [...D.prompts].sort((a,b)=>a.ts-b.ts)
  let cw = 0
  const wPoints = [{ ts: D.sessionStart, w: 0 }]
  for (const p of promptByTs) { cw += p.weighted; wPoints.push({ ts: p.ts, w: cw }) }
  wPoints.push({ ts: D.generatedAt, w: cw })
  const finalWeighted = cw
  const pctScale = (D.currentPct != null && finalWeighted > 0) ? D.currentPct / finalWeighted : null
  const maxY1 = pctScale ? 100 : Math.max(1, finalWeighted * 1.3)
  const maxPr = Math.max(1, D.promptCount * 1.2)
  const y1 = w => H - PAD.b - (pctScale ? (w * pctScale) : w) / maxY1 * (H - PAD.t - PAD.b)
  const y2 = p => H - PAD.b - p / maxPr * (H - PAD.t - PAD.b)
  const TICK = 30 * 60 * 1000
  for (let t = Math.ceil(x0 / TICK) * TICK; t <= x1; t += TICK) {
    const x = xs(t)
    el('line', { x1: x, y1: PAD.t, x2: x, y2: H - PAD.b, stroke: '#1d2127' }, chart)
    const lbl = el('text', { x: x, y: H - PAD.b + 16, fill: '#888', 'font-size': 10, 'text-anchor': 'middle' }, chart)
    lbl.textContent = fmtTime(t)
  }
  for (let i = 0; i <= 4; i++) {
    const y = PAD.t + i * (H - PAD.t - PAD.b) / 4
    el('line', { x1: PAD.l, y1: y, x2: W - PAD.r, y2: y, stroke: '#1d2127' }, chart)
    const v = maxY1 * (1 - i / 4)
    const t1 = el('text', { x: PAD.l - 6, y: y + 3, fill: '#7aa2f7', 'font-size': 10, 'text-anchor': 'end' }, chart)
    t1.textContent = pctScale ? v.toFixed(0) + '%' : (v / 1e6).toFixed(1) + 'M'
    const v2 = Math.round(maxPr * (1 - i / 4))
    const t2 = el('text', { x: W - PAD.r + 6, y: y + 3, fill: '#f7768e', 'font-size': 10, 'text-anchor': 'start' }, chart)
    t2.textContent = String(v2)
  }
  if (pctScale) {
    const yL = y1(100 / pctScale)
    el('line', { x1: PAD.l, y1: yL, x2: W - PAD.r, y2: yL, stroke: '#f7768e', 'stroke-width': 1, 'stroke-dasharray': '4,4' }, chart)
  }
  const xEnd = xs(x1)
  el('line', { x1: xEnd, y1: PAD.t, x2: xEnd, y2: H - PAD.b, stroke: '#444', 'stroke-dasharray': '2,3' }, chart)
  const xNow = xs(D.generatedAt)
  el('line', { x1: xNow, y1: PAD.t, x2: xNow, y2: H - PAD.b, stroke: '#e0af68', 'stroke-width': 1 }, chart)
  const nt = el('text', { x: xNow + 4, y: PAD.t + 10, fill: '#e0af68', 'font-size': 10 }, chart)
  nt.textContent = 'now (' + (D.currentPct != null ? D.currentPct + '%' : 'no data') + ')'
  let p1 = '', p2 = ''
  wPoints.forEach((s, i) => { p1 += (i === 0 ? 'M' : 'L') + xs(s.ts) + ',' + y1(s.w) + ' ' })
  D.series.forEach((s, i) => { p2 += (i === 0 ? 'M' : 'L') + xs(s.ts) + ',' + y2(s.cumPrompts) + ' ' })
  el('path', { d: p1, fill: 'none', stroke: '#7aa2f7', 'stroke-width': 2 }, chart)
  el('path', { d: p2, fill: 'none', stroke: '#f7768e', 'stroke-width': 1.5, 'stroke-dasharray': '3,3' }, chart)
  if (pctScale && D.currentPct < 100 && D.currentPct > 0) {
    const elapsedMs = D.generatedAt - D.sessionStart
    const rate = D.currentPct / elapsedMs
    const remToFull = 100 - D.currentPct
    const tToFull = remToFull / rate
    const exhaustTs = D.generatedAt + tToFull
    if (exhaustTs <= D.sessionEnd) {
      const xE = xs(exhaustTs)
      el('line', { x1: xNow, y1: y1(finalWeighted), x2: xE, y2: y1(100 / pctScale), stroke: '#e0af68', 'stroke-width': 1.5, 'stroke-dasharray': '5,3', opacity: 0.7 }, chart)
      el('line', { x1: xE, y1: PAD.t, x2: xE, y2: H - PAD.b, stroke: '#e0af68', 'stroke-width': 1, 'stroke-dasharray': '2,3', opacity: 0.7 }, chart)
      const et = el('text', { x: xE + 4, y: PAD.t + 24, fill: '#e0af68', 'font-size': 10 }, chart)
      et.textContent = '100% @ ' + fmtTime(exhaustTs)
    } else {
      const finishPct = (D.currentPct + (rate * (D.sessionEnd - D.generatedAt))).toFixed(0)
      const et = el('text', { x: xNow + 4, y: PAD.t + 24, fill: '#9ece6a', 'font-size': 10 }, chart)
      et.textContent = 'finish at ~' + finishPct + '%'
    }
  }
  const maxPromptW = Math.max(1, ...D.prompts.map(p => p.weighted))
  let runW = 0
  for (const p of promptByTs) {
    runW += p.weighted
    const r = 3 + Math.sqrt(p.weighted / maxPromptW) * 10
    const c = el('circle', { cx: xs(p.ts), cy: y1(runW), r: r, fill: '#9ece6a', 'fill-opacity': 0.6, stroke: '#9ece6a', 'stroke-width': 1, style: 'cursor:pointer' }, chart)
    c.addEventListener('mouseenter', e => {
      const localPct = pctScale ? (p.weighted * pctScale).toFixed(1) + '% of limit' : (p.weighted/1e3).toFixed(0) + 'k weighted'
      showTip(e, [
        { bold: true, text: new Date(p.ts).toLocaleTimeString() + ' · ' + p.project },
        { text: '' }, { text: p.text }, { text: '' },
        { color: '#888', text: p.calls + ' api calls · ' + (p.tokens/1e3).toFixed(0) + 'k raw · ' + localPct },
      ])
    })
    c.addEventListener('mouseleave', hideTip)
  }
}

function renderTable() {
  const prompts = D.prompts.slice()
  const pctScale = (D.currentPct != null && D.totalWeighted > 0) ? D.currentPct / D.totalWeighted : null
  prompts.sort((a, b) => {
    const va = a[sortKey], vb = b[sortKey]
    if (typeof va === 'number') return sortDesc ? vb - va : va - vb
    return sortDesc ? String(vb).localeCompare(String(va)) : String(va).localeCompare(String(vb))
  })
  const max = Math.max(1, ...prompts.map(p => p.weighted))
  while (tbody.firstChild) tbody.removeChild(tbody.firstChild)
  for (const p of prompts) {
    const tr = document.createElement('tr')
    const c = (txt, cls) => { const td = document.createElement('td'); if (cls) td.className = cls; td.textContent = txt; tr.appendChild(td); return td }
    c(new Date(p.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }))
    const ptd = c(p.text, 'prompt'); ptd.title = p.text
    c(p.project, 'proj')
    c(String(p.calls), 'num')
    c((p.tokens/1e3).toFixed(1) + 'k', 'num')
    const wtd = document.createElement('td'); wtd.className = 'num'
    const bar = document.createElement('span'); bar.className = 'bar'; bar.style.width = (p.weighted / max * 80).toFixed(0) + 'px'
    wtd.appendChild(bar)
    const lbl = pctScale ? (p.weighted * pctScale).toFixed(2) + '%' : (p.weighted/1e3).toFixed(1) + 'k'
    wtd.appendChild(document.createTextNode(lbl))
    tr.appendChild(wtd)
    tbody.appendChild(tr)
  }
}

document.querySelectorAll('#prompt-table th').forEach(th => {
  th.addEventListener('click', () => {
    const k = th.dataset.sort
    if (sortKey === k) sortDesc = !sortDesc; else { sortKey = k; sortDesc = true }
    if (D) renderTable()
  })
})

function applySnapshot(snap) {
  D = snap
  if (!D || !D.sessionStart) { document.getElementById('s-updated').textContent = 'no data'; return }
  renderHeader(); renderChart(); renderTable()
}

let es
function connect() {
  es = new EventSource('/stream')
  es.onopen = () => { header.classList.remove('disconnected'); document.getElementById('s-updated').textContent = 'connected' }
  es.onmessage = ev => { try { applySnapshot(JSON.parse(ev.data)) } catch {} }
  es.onerror = () => { header.classList.add('disconnected'); document.getElementById('s-updated').textContent = 'disconnected, retrying…'; es.close(); setTimeout(connect, 2000) }
}
connect()
</script>
</body></html>
